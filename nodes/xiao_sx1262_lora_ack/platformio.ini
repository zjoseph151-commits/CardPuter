[platformio]
default_envs = xiao_esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
  pre:../../tools/esptool_compat.py
  post:../../tools/esptool_compat.py
platform_packages =
  tool-esptoolpy @ platformio/tool-esptoolpy@1.40801.0
lib_deps =
  jgromes/RadioLib

; The standalone Wio-SX1262 for XIAO uses the normal XIAO headers.
[env:xiao_esp32s3]
build_flags =
  ${env.build_flags}
  -DXIAO_LORA_NSS_PIN=5
  -DXIAO_LORA_DIO1_PIN=2
  -DXIAO_LORA_RST_PIN=3
  -DXIAO_LORA_BUSY_PIN=4
  -DXIAO_LORA_RF_SWITCH_PIN=1

; The XIAO ESP32S3 + Wio-SX1262 kit uses the rear B2B connector instead.
[env:xiao_esp32s3_b2b]
build_flags =
  ${env.build_flags}
  -DXIAO_LORA_NSS_PIN=41
  -DXIAO_LORA_DIO1_PIN=39
  -DXIAO_LORA_RST_PIN=42
  -DXIAO_LORA_BUSY_PIN=40
  -DXIAO_LORA_RF_SWITCH_PIN=38
