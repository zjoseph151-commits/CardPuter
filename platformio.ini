[platformio]
default_envs = m5stack-stamps3

[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
  m5stack/M5Cardputer
  m5stack/M5Unit-ENV
  z3t0/IRremote@^4.7.1
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
  olikraus/U8g2@^2.36.12
  jgromes/RadioLib
